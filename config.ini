# =============================================================================
# xGEOID20B Batch Extraction Tool - Configuration
# =============================================================================
# This file is OPTIONAL. If it is missing or a value is blank, the tool
# falls back to sensible built-in defaults (the values shown below).
#
# The tool is designed to run "out of the box" with NO interaction:
#   - It reads the single input CSV from the input/ folder.
#   - It writes UTC-timestamped output + log files to the output/ folder.
#   - It OVERWRITES without asking (overwrite = always). Because output
#     names are timestamped to the minute, runs normally do not collide.
#
# See readme.md ("Default Behavior") for the full explanation.
# =============================================================================

[paths]
# Full path to the xGEOID20.ggxf grid file.
# Leave BLANK to use the default resolution order:
#   1. XGEOID20_GGXF environment variable (if set)
#   2. this ggxf_file value (if set)
#   3. GGXF/xGEOID20.ggxf in the script directory
ggxf_file =

# Folders (relative to the script directory, or absolute).
input_dir  = input
output_dir = output

[model]
model = xGEOID20B
epoch = 2020.0
t0    = 2005.0

[options]
# Overwrite policy for the (rare) case that a timestamped output file
# already exists:
#   always  - overwrite without asking (default; non-interactive)
#   never   - skip and exit without overwriting
#   prompt  - ask y/n at the console (interactive only)
overwrite = always

[transform]
# Optional horizontal coordinate transform. When enabled, the tool
# transforms the input horizontal coordinates to ITRF2014 / IGS14 using the
# bundled NGS HTDP utility and appends the transformed lat/lon/eht as extra
# output columns. The geoid/orthometric computation itself is unaffected
# (it always uses the INPUT coordinates).
#
# enabled : true | false. Default true. Set false to skip the transform
#           (output IGS14 columns will be blank).
#
# input_frame : the NAD83 realization of the INPUT coordinates. The USER is
#           responsible for supplying coordinates in one of these frames
#           (the tool does NOT verify this):
#             2011 -> NAD83(2011/CORS96/2007)   [CONUS]
#             PA11 -> NAD83(PA11/PACP00)         [Pacific]
#             MA11 -> NAD83(MA11/MARP00)         [Marianas]
#
# input_epoch  / output_epoch : reference epochs for the transform.
#           DECIMAL YEAR is the documented/recommended format (e.g. 2010.0).
#           A calendar date (M D Y or M/D/Y, e.g. 1 1 2010) is also accepted
#           as a secondary option.
#           For the NAD83(2011/PA11/MA11) -> ITRF2014/IGS14 transformation
#           the nominal reference epoch is 2010.0 for BOTH input and output,
#           which are the defaults here. (Override if your data requires it.)
#
# The OUTPUT frame is fixed to ITRF2014 / IGS14 (HTDP frame code 25) and is
# not user-configurable.
#
# htdp_exe : path to the HTDP executable. Leave BLANK to use the bundled
#           HTDP/htdp360.exe. HTDP is Windows-only, so the transform is
#           available on Windows only.
enabled      = true
input_frame  = 2011
input_epoch  = 2010.0
output_epoch = 2010.0
htdp_exe     =

[runtime]
# Used ONLY by the run.ps1 launcher to select the conda environment the
# tool runs in. (The Python script itself does not read this section.)
#
# conda_root : Path to your conda/Miniconda/Anaconda INSTALL directory.
#              Leave BLANK to autodetect (conda on PATH, then the common
#              locations under your user profile: Miniconda3, miniconda3,
#              Anaconda3). Set this explicitly if conda is NOT on PATH or
#              you have multiple installs and want a specific one.
#              Example: C:\Users\you\Miniconda3
#
# conda_env  : Name of the conda environment to use. Leave BLANK for the
#              base environment. Example: xgeoid
#
# The launcher verifies that conda exists, the environment exists, and
# that netCDF4 + numpy import successfully before running. It errors out
# with guidance if any check fails.
conda_root =
conda_env  =
