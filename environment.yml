# =============================================================================
# xGEOID20B Batch Extraction Tool - conda environment definition
# =============================================================================
# Conda is the recommended package manager for this tool. netCDF4 and numpy
# rely on compiled binary libraries (HDF5, netCDF-C), and conda resolves and
# installs those binary dependencies far more reliably than pip.
#
# Create the environment:
#     conda env create -f environment.yml
#
# Then either activate it:
#     conda activate xgeoid
# or set conda_env = xgeoid in config.ini and use run.ps1.
# =============================================================================
name: xgeoid
channels:
  - conda-forge
dependencies:
  # Python is pinned to 3.12 for stable, universal package support. Newer
  # interpreters (3.14 free-threaded) lack reliable wheels/builds for some
  # dependencies and also emit GIL warnings from netCDF4. 3.12 avoids that.
  - python=3.12
  # Compiled scientific dependencies come from conda-forge, which resolves
  # their binary libraries (HDF5, netCDF-C) far more reliably than pip.
  - netCDF4>=1.6.0
  - numpy>=1.23.0
  # openpyxl is only needed for the optional 'xlsx' output format. If it is
  # absent, the tool simply skips xlsx output (CSV/JSON still work).
  - openpyxl>=3.0.0

# NOTE: The optional horizontal coordinate transform (NAD83 realizations ->
# IGS14) drives the bundled NGS HTDP utility (HTDP/htdp360.exe) via Python's
# standard-library subprocess module. No extra packages are required for it.

